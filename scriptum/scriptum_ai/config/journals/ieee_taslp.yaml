name: "IEEE/ACM Transactions on Audio, Speech, and Language Processing"
scope: >
  Publishes research on audio, speech, and language processing including
  speech recognition, synthesis, speaker verification, audio analysis,
  natural language processing, machine translation, and spoken language
  understanding.
review_criteria:
  technical_quality:
    weight: 0.30
    description: >
      Soundness of methodology, correctness of theoretical analysis,
      validity of experimental design and statistical significance of results.
  novelty:
    weight: 0.25
    description: >
      Originality of contribution compared to existing literature.
      Incremental improvements must clearly quantify gains.
  clarity:
    weight: 0.15
    description: >
      Quality of writing, logical flow, and reproducibility of results.
      Figures and tables should be self-contained and informative.
  significance:
    weight: 0.20
    description: >
      Impact on the field, practical applicability, and potential
      to inspire future research directions.
  completeness:
    weight: 0.10
    description: >
      Thoroughness of related work, ablation studies, and analysis
      of failure cases or limitations.
formatting_rules:
  page_limit: 14
  citation_style: "IEEE"
  double_blind: true
  abstract_word_limit: 200
  required_sections:
    - Abstract
    - Introduction
    - Related Work
    - Methodology
    - Experiments
    - Results
    - Conclusion
  supplementary_allowed: true
ethics_policy: >
  Authors must disclose data collection practices, potential biases,
  and societal impact. Human subject research requires IRB approval.
review_timeline:
  first_decision: "8-12 weeks"
  revision_period: "4-8 weeks"
