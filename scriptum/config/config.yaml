# SCRIPTUM Configuration
# Typically located at ~/.scriptum/config.yaml
# Environment variables override any setting here.

# LLM Provider Configuration
llm:
  default_provider: "anthropic"

  providers:
    anthropic:
      api_key: ""  # or set ANTHROPIC_API_KEY env var
      default_model: "claude-opus-4-6"
      enabled: true

    openai:
      api_key: ""  # or set OPENAI_API_KEY env var
      default_model: "gpt-4-turbo"
      enabled: false

    ollama:
      base_url: "http://localhost:11434"
      default_model: "llama2"
      enabled: false

# Model Context Protocol (MCP) Tools
mcp:
  perplexity:
    api_key: ""  # or set PERPLEXITY_API_KEY env var
    enabled: false

  google_search:
    api_key: ""  # or set GOOGLE_SEARCH_API_KEY env var
    cx: ""       # Custom search engine ID
    enabled: false

# External Research APIs
apis:
  semantic_scholar:
    api_key: ""  # Optional, increases rate limits

  arxiv:
    enabled: true

  crossref:
    enabled: true

# Agent Configuration
agents:
  framework: "langgraph"  # langgraph | crewai | smolagents
  max_parallel: 3
  timeout: 300  # seconds per agent

# Database Configuration
database:
  url: "sqlite+aiosqlite:///~/.scriptum/scriptum.db"
  # For production: postgresql+asyncpg://user:pass@localhost/scriptum

# Document Processing
document:
  grobid_url: "http://localhost:8070"
  fallback_enabled: true  # Use PyMuPDF if GROBID unavailable

# Vector Store (ChromaDB)
vector_store:
  persist_directory: "~/.scriptum/chroma"
  collection_name: "scriptum_knowledge"

# Logging
logging:
  level: "INFO"
  format: "json"
  directory: "~/.scriptum/logs"

# Security
security:
  encryption_key: ""  # Auto-generated if not set
